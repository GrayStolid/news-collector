name: News Digest

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Coverage window"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - 2-day
          - 3-day
          - weekly
      topics:
        description: "Optional comma-separated topic override"
        required: false
        default: ""
        type: string

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate digest
        env:
          NEWS_MODE: ${{ github.event.inputs.mode || 'daily' }}
          NEWS_TOPICS: ${{ github.event.inputs.topics || '' }}
        run: python scripts/generate_news_digest.py --mode "${NEWS_MODE}" --topics "${NEWS_TOPICS}"

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if ! git diff --cached --quiet; then
            git commit -m "Update news digest"
            git push
          fi
